<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started — PropManage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/web/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #0F172A, #1E1B4B);
        }
        .login-page { display: flex; width: 100%; min-height: 100vh; }
        .login-brand {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            padding: 60px; color: white;
        }
        .login-brand h1 { font-size: 44px; font-weight: 800; margin-bottom: 16px; }
        .login-brand h1 span { color: #818CF8; }
        .login-brand p { font-size: 18px; color: #94A3B8; line-height: 1.7; max-width: 480px; }
        .login-form-wrapper {
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px;
        }
        .login-card {
            background: white; border-radius: 20px; padding: 40px;
            width: 100%; max-width: 440px; box-shadow: var(--shadow-xl);
        }
        .login-card .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
        .login-card .logo .logo-icon {
            width: 40px; height: 40px; background: var(--gradient); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: 800;
        }
        .login-card .logo span {
            font-size: 22px; font-weight: 800;
            background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-card h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
        .login-card .subtitle { font-size: 14px; color: var(--gray-500); margin-bottom: 28px; }
        .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .error-msg {
            background: #FEE2E2; color: #991B1B; padding: 12px 16px;
            border-radius: 10px; font-size: 14px; margin-bottom: 16px; display: none;
        }
        .alt-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray-500); }
        .alt-link a { color: var(--primary); font-weight: 600; }
        @media (max-width: 768px) { .login-brand { display: none; } .login-card { padding: 28px; } }
    </style>
</head>
<body>
<div class="login-page">
    <div class="login-brand">
        <a href="/web/index.html" style="color: white; margin-bottom: 40px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; opacity: 0.7;">&#8592; Back to Home</a>
        <h1>Start Managing<br>Properties with <span>AI</span></h1>
        <p>Create your account and let Stacy handle tenant requests, maintenance, parking, and more — 24/7.</p>
    </div>
    <div class="login-form-wrapper">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">P</div>
                <span>PropManage</span>
            </div>
            <h2>Create Your Account</h2>
            <p class="subtitle">Start your free trial — no credit card required</p>

            <div class="error-msg" id="error-msg"></div>

            <form onsubmit="handleRegister(event)">
                <div class="name-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" class="form-control" id="first_name" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" class="form-control" id="last_name" placeholder="Smith" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="form-control" id="phone" placeholder="(555) 123-4567">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="register-btn" style="margin-top: 8px; padding: 14px; font-size: 16px;">
                    Create Account
                </button>
            </form>

            <div class="alt-link">
                Already have an account? <a href="/web/landlord-login.html">Sign in</a>
            </div>
        </div>
    </div>
</div>

<script src="/web/js/app.js"></script>
<script>
async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    const errorEl = document.getElementById('error-msg');
    errorEl.style.display = 'none';

    const body = {
        first_name: document.getElementById('first_name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value,
        role: 'landlord',
    };

    if (!body.first_name || !body.last_name || !body.email || !body.password) {
        errorEl.textContent = 'Please fill in all required fields';
        errorEl.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating Account...';

    try {
        const data = await apiCall('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify(body),
        });

        setAuth(data);
        window.location.href = '/web/plans.html';
    } catch (err) {
        errorEl.textContent = err.message || 'Registration failed';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account';
    }
}
</script>
</body>
</html>
